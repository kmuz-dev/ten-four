<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ten-Four brand preview</title>
    <style>
      :root {
        --color-tally: #ff4a26;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #d8d3c8;
        color: #1d1d1f;
        font-family: system-ui, sans-serif;
      }

      .canvas {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        min-height: 100vh;
        padding: 40px;
      }

      .panel {
        display: grid;
        min-width: 0;
        place-items: center;
        padding: 40px;
        border-radius: 20px;
        background: #f2f1ee;
      }

      .panel.dark {
        background: #1c1c1e;
        color: #f2f2ef;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: inherit;
      }

      .brand svg {
        display: block;
        flex: none;
      }

      [role="img"] {
        display: flex;
        align-items: center;
        gap: 10px;
        color: inherit;
      }

      #app-icon {
        grid-row: span 2;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/tests/brand-preview-entry.tsx"></script>
  </body>
</html>
